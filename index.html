<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Code Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="card">
      <h1>Verification code</h1>
      <p>Enter the shared password. The password is never uploaded.</p>

      <div id="missingRoom" class="hidden">
        <p>No room was found in this link.</p>
        <a href="setup.html">Create a room</a>
      </div>

      <div id="viewer">
        <label for="password">Shared password</label>
        <input
          id="password"
          type="password"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Shared password"
        >

        <button id="unlock">Unlock & wait for code</button>

        <div id="status" class="status"></div>

        <div id="codeBox" class="code-box">
          <div id="code" class="code"></div>
          <div id="expires" class="small"></div>
          <button id="copyCode" class="secondary">Copy code</button>
          <button id="hideCode" class="secondary">Hide code</button>
        </div>
      </div>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script src="crypto.js"></script>
  <script src="common.js"></script>
  <script>
    const roomId = getRoomId();
    const viewer = document.getElementById("viewer");
    const missingRoom = document.getElementById("missingRoom");
    const passwordInput = document.getElementById("password");
    const unlockButton = document.getElementById("unlock");
    const statusEl = document.getElementById("status");
    const codeBox = document.getElementById("codeBox");
    const codeEl = document.getElementById("code");
    const expiresEl = document.getElementById("expires");
    const copyCodeButton = document.getElementById("copyCode");
    const hideCodeButton = document.getElementById("hideCode");

    let cfg;
    let password = "";
    let polling = false;
    let timer = null;
    let lastCiphertext = null;
    let currentExpiry = 0;

    if (!roomId) {
      viewer.classList.add("hidden");
      missingRoom.classList.remove("hidden");
    }

    try {
      cfg = getConfig();
    } catch (err) {
      setStatus(statusEl, err.message);
      unlockButton.disabled = true;
    }

    async function checkForCode() {
      if (!polling || !cfg || !roomId) return;

      try {
        const payload = await firebaseGet(cfg.databaseURL, roomId);

        if (!payload) {
          codeBox.style.display = "none";
          setStatus(statusEl, "Waiting for a code...");
          return;
        }

        if (
          !payload.ciphertext ||
          !payload.iv ||
          !payload.salt ||
          !Number.isFinite(payload.expiresAt)
        ) {
          setStatus(statusEl, "Received invalid data. Waiting...");
          return;
        }

        if (payload.expiresAt <= Date.now()) {
          codeBox.style.display = "none";
          setStatus(statusEl, "The last code expired. Waiting for a new one...");
          return;
        }

        // Avoid doing expensive PBKDF2 repeatedly for the same payload.
        if (payload.ciphertext === lastCiphertext && codeBox.style.display === "block") {
          return;
        }

        const decrypted = await decryptText(payload, password);

        if (!/^\d{4,8}$/.test(decrypted)) {
          throw new Error("Decrypted value was not a valid code.");
        }

        lastCiphertext = payload.ciphertext;
        currentExpiry = payload.expiresAt;
        codeEl.textContent = decrypted;
        codeBox.style.display = "block";
        setStatus(statusEl, "New code received.");
      } catch (err) {
        // AES-GCM fails if the password is wrong.
        if (String(err && err.name) === "OperationError") {
          codeBox.style.display = "none";
          setStatus(statusEl, "Wrong shared password, or the code data is invalid.");
          stopPolling();
        } else {
          setStatus(statusEl, err.message || "Could not check for a code.");
        }
      }
    }

    function startPolling() {
      stopPolling();
      polling = true;
      checkForCode();
      timer = setInterval(checkForCode, cfg.pollMs);
    }

    function stopPolling() {
      polling = false;
      if (timer) clearInterval(timer);
      timer = null;
    }

    unlockButton.addEventListener("click", () => {
      password = passwordInput.value;

      if (password.length < 8) {
        setStatus(statusEl, "Use a shared password with at least 8 characters.");
        return;
      }

      passwordInput.value = "";
      lastCiphertext = null;
      setStatus(statusEl, "Waiting for a code...");
      startPolling();
    });

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") unlockButton.click();
    });

    copyCodeButton.addEventListener("click", async () => {
      const value = codeEl.textContent.trim();
      if (!value) return;

      try {
        await navigator.clipboard.writeText(value);
        setStatus(statusEl, "Code copied.");
      } catch {
        setStatus(statusEl, "Could not copy automatically. Select the code manually.");
      }
    });

    hideCodeButton.addEventListener("click", () => {
      codeEl.textContent = "";
      codeBox.style.display = "none";
      lastCiphertext = null;
      setStatus(statusEl, "Code hidden. Still waiting for updates...");
    });

    setInterval(() => {
      if (codeBox.style.display !== "block" || !currentExpiry) return;
      const remaining = currentExpiry - Date.now();
      expiresEl.textContent = `Expires in ${formatRemaining(remaining)}`;

      if (remaining <= 0) {
        codeEl.textContent = "";
        codeBox.style.display = "none";
        lastCiphertext = null;
        setStatus(statusEl, "Code expired. Waiting for a new one...");
      }
    }, 1000);

    window.addEventListener("beforeunload", stopPolling);
  </script>
</body>
</html>
