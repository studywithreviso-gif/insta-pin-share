<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Code Receiver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="card">
      <h1>Verification code</h1>
      <p>Enter the permanent shared password once, then this page will wait for new codes.</p>

      <div id="missingRoom" class="hidden">
        <p>This link does not contain a valid room.</p>
        <a href="setup.html">Set up a room</a>
      </div>

      <div id="receiver">
        <div id="unlockArea">
          <label for="password">Shared password</label>
          <input
            id="password"
            type="password"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Shared password"
          >
          <button id="unlock">Unlock</button>
        </div>

        <div id="status" class="status"></div>

        <div id="waitBox" class="wait-box">
          <strong><span class="spinner"></span>Waiting for code...</strong>
          <p class="small">Keep this tab open. A new code will appear automatically.</p>
        </div>

        <div id="codeBox" class="code-box">
          <div class="small">Current verification code</div>
          <div id="code" class="code"></div>
          <div id="expires" class="small"></div>
          <button id="copyCode" class="secondary">Copy code</button>
        </div>

        <button id="lockAgain" class="secondary hidden">Lock again</button>
      </div>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script src="crypto.js"></script>
  <script src="common.js"></script>
  <script>
    const roomId = getRoomId();

    const receiver = document.getElementById("receiver");
    const missingRoom = document.getElementById("missingRoom");
    const unlockArea = document.getElementById("unlockArea");
    const passwordInput = document.getElementById("password");
    const unlockButton = document.getElementById("unlock");
    const statusEl = document.getElementById("status");
    const waitBox = document.getElementById("waitBox");
    const codeBox = document.getElementById("codeBox");
    const codeEl = document.getElementById("code");
    const expiresEl = document.getElementById("expires");
    const copyCodeButton = document.getElementById("copyCode");
    const lockAgainButton = document.getElementById("lockAgain");

    let cfg = null;
    let roomPassword = "";
    let pollingTimer = null;
    let lastCiphertext = null;
    let currentExpiry = 0;
    let unlocked = false;

    if (!roomId) {
      receiver.classList.add("hidden");
      missingRoom.classList.remove("hidden");
    }

    try {
      cfg = getConfig();
    } catch (err) {
      setStatus(statusEl, err.message, "bad");
      unlockButton.disabled = true;
    }

    function showWaiting(message = "Waiting for code...") {
      codeEl.textContent = "";
      codeBox.style.display = "none";
      waitBox.style.display = "block";
      waitBox.querySelector("strong").innerHTML =
        `<span class="spinner"></span>${message}`;
      currentExpiry = 0;
    }

    function stopPolling() {
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = null;
    }

    async function pollMessage() {
      if (!unlocked || !cfg || !roomId || !roomPassword) return;

      try {
        const payload = await getLiveMessage(cfg.databaseURL, roomId);

        if (!payload) {
          lastCiphertext = null;
          showWaiting();
          return;
        }

        if (
          !payload.ciphertext ||
          !payload.iv ||
          !payload.salt ||
          !Number.isFinite(payload.expiresAt) ||
          payload.expiresAt <= Date.now()
        ) {
          lastCiphertext = null;
          showWaiting();
          return;
        }

        if (payload.ciphertext === lastCiphertext && codeBox.style.display === "block") {
          currentExpiry = payload.expiresAt;
          return;
        }

        const value = await decryptText(payload, roomPassword);

        if (!validVerificationCode(value)) {
          throw new Error("The received data was not a valid verification code.");
        }

        lastCiphertext = payload.ciphertext;
        currentExpiry = payload.expiresAt;
        waitBox.style.display = "none";
        codeEl.textContent = value;
        codeBox.style.display = "block";
        setStatus(statusEl, "Connected. New codes will appear automatically.", "good");
      } catch (err) {
        setStatus(statusEl, err.message || "Could not check for a new code.", "bad");
      }
    }

    async function unlockReceiver() {
      if (!cfg || !roomId) return;

      const password = passwordInput.value;

      if (!validSharedPassword(password)) {
        setStatus(statusEl, "Shared password must be at least 10 characters.", "bad");
        return;
      }

      unlockButton.disabled = true;
      setStatus(statusEl, "Checking password...");

      try {
        const roomConfig = await getRoomConfig(cfg.databaseURL, roomId);

        if (!roomConfig) {
          throw new Error(
            "This room has not been initialized with a permanent password yet."
          );
        }

        const correct = await verifyRoomPassword(roomConfig, password);

        if (!correct) {
          setStatus(statusEl, "Incorrect shared password.", "bad");
          return;
        }

        roomPassword = password;
        passwordInput.value = "";
        unlocked = true;

        unlockArea.classList.add("hidden");
        lockAgainButton.classList.remove("hidden");
        showWaiting();
        setStatus(statusEl, "Connected. Waiting for a code...", "good");

        stopPolling();
        await pollMessage();
        pollingTimer = setInterval(pollMessage, cfg.pollMs);
      } catch (err) {
        setStatus(statusEl, err.message || "Could not unlock this room.", "bad");
      } finally {
        unlockButton.disabled = false;
      }
    }

    function lockReceiver() {
      stopPolling();
      unlocked = false;
      roomPassword = "";
      lastCiphertext = null;
      currentExpiry = 0;
      codeEl.textContent = "";
      codeBox.style.display = "none";
      waitBox.style.display = "none";
      unlockArea.classList.remove("hidden");
      lockAgainButton.classList.add("hidden");
      setStatus(statusEl, "Locked.");
      passwordInput.focus();
    }

    unlockButton.addEventListener("click", unlockReceiver);

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") unlockReceiver();
    });

    copyCodeButton.addEventListener("click", async () => {
      const value = codeEl.textContent.trim();
      if (!value) return;

      try {
        await navigator.clipboard.writeText(value);
        setStatus(statusEl, "Code copied.", "good");
      } catch {
        setStatus(statusEl, "Could not copy automatically. Copy it manually.", "bad");
      }
    });

    lockAgainButton.addEventListener("click", lockReceiver);

    setInterval(() => {
      if (codeBox.style.display !== "block" || !currentExpiry) return;

      const remaining = currentExpiry - Date.now();
      expiresEl.textContent = `Expires in ${formatRemaining(remaining)}`;

      if (remaining <= 0) {
        lastCiphertext = null;
        showWaiting();
        setStatus(statusEl, "Previous code expired. Waiting for a new code...", "good");
      }
    }, 1000);

    window.addEventListener("beforeunload", stopPolling);
  </script>
</body>
</html>
